<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Braganza Dental Clinic — Clinic Management System</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--brand:#2563EB;--brand-dark:#1D4ED8;--brand-soft:#EDF3FE;
--teal:#4FAFC8;--tint:#E1F0F7;--tint-line:#C9E3EE;--tint-head:#EEF8FB;
--bg:#F4F6F9;--surface:#FFFFFF;--line:#E4E8EF;--line-2:#D7DEE8;
--ink:#1B2430;--ink-2:#48505C;--muted:#7B8797;
--ok-bg:#E7F7ED;--ok:#15794A;--ok-line:#BFE9CF;
--warn-bg:#FDF3D7;--warn:#95661A;--warn-line:#F0DDA8;
--bad-bg:#FCE8E8;--bad:#B23A32;--bad-line:#F4C9C6;
--info-bg:#DCF0F8;--info:#0E6E8C;--info-line:#BEE2EE;
--r:10px;--r-sm:7px;
}
html,body{height:100%}
body{font-family:Georgia,"Times New Roman","Nimbus Roman",Times,serif;font-size:14px;line-height:1.55;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
svg{display:block}
:focus-visible{outline:2px solid #8FB3F5;outline-offset:1px;border-radius:4px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#D3DAE4;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;min-height:100vh}
.sidebar{width:238px;flex:0 0 238px;background:#fff;border-right:1px solid var(--line);height:100vh;position:sticky;top:0;display:flex;flex-direction:column;overflow:hidden;z-index:60}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px;margin:10px 12px 6px;border:1px solid var(--tint-line);border-radius:var(--r);background:#F7FBFD}
.brand-mark{width:38px;height:38px;flex:0 0 38px;display:grid;place-items:center;color:var(--teal)}
.brand-name{font-family:Georgia,"Times New Roman",serif;font-size:19px;letter-spacing:.09em;line-height:1.05;color:#2E3A46}
.brand-sub{font-size:9.5px;letter-spacing:.22em;color:#7C8A97;margin-top:3px}
.nav{padding:8px 12px 14px;display:flex;flex-direction:column;gap:7px;flex:1 1 auto;min-height:0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13.5px;color:var(--ink-2);text-align:left;width:100%;transition:background .12s,color .12s}
.nav-item svg{flex:0 0 17px;color:var(--brand)}
.nav-item:hover{background:#F6F8FB}
.nav-item.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.nav-item.active svg{color:#fff}
.nav-count{margin-left:auto;font-size:11px;background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad-line);border-radius:20px;padding:0 7px;line-height:17px}
.nav-item.active .nav-count{background:rgba(255,255,255,.22);border-color:transparent;color:#fff}
.promo{margin:auto 12px 14px;background:var(--brand);color:#fff;border-radius:var(--r);padding:16px 15px}
.promo-icon{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.18);display:grid;place-items:center;margin-bottom:12px}
.promo h4{font-size:14px;font-weight:600}
.promo p{font-size:11.5px;line-height:1.5;color:#DCE7FD;margin:5px 0 12px}
.promo button{width:100%;background:#fff;color:var(--brand);font-size:13px;font-weight:600;border-radius:var(--r-sm);padding:8px 10px}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:11px 22px}
.page-title{font-size:20px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.search{position:relative;flex:1;max-width:520px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;background:#F2F5F9;border:1px solid var(--line);border-radius:8px;padding:9px 12px 9px 36px;font-size:13.5px}
.search input::placeholder{color:#9AA4B2}
.search input:focus{outline:none;border-color:#B9CDF6;background:#fff}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;max-height:340px;overflow-y:auto}
.search-results button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;border-bottom:1px solid var(--line);text-align:left}
.search-results button:last-child{border-bottom:none}
.search-results button:hover{background:#F6F8FB}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:14px}
.icon-btn{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);position:relative;border:1px solid transparent}
.icon-btn:hover{background:#F2F5F9;border-color:var(--line)}
.dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:#E5533D;border:2px solid #fff}
.user-chip{display:flex;align-items:center;gap:9px;padding:4px 8px 4px 4px;border-radius:8px;border:1px solid transparent}
.user-chip:hover{background:#F2F5F9;border-color:var(--line)}
.user-meta{text-align:left;line-height:1.25}
.user-meta b{display:block;font-size:13px;font-weight:600}
.user-meta span{font-size:11.5px;color:var(--muted)}
.menu{position:absolute;top:calc(100% + 8px);right:0;width:250px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;z-index:70}
.menu-head{padding:12px 14px;border-bottom:1px solid var(--line);background:#F8FAFC}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 14px;font-size:13.5px;text-align:left;color:var(--ink-2)}
.menu button:hover{background:#F4F7FA}
.notif{width:340px}
.notif-item{display:flex;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.notif-item:hover{background:#F8FAFC}
.notif-item p{font-size:12.5px;color:var(--ink-2);line-height:1.45}
.notif-item time{font-size:11px;color:var(--muted)}
.rel{position:relative}
.hamburger{display:none}

.view{padding:20px 22px 44px;flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.stat{background:var(--tint);border:1px solid var(--tint-line);border-radius:var(--r);padding:14px 16px;display:flex;align-items:center;gap:13px}
.stat-icon{width:40px;height:40px;flex:0 0 40px;border-radius:9px;background:#fff;display:grid;place-items:center;color:var(--info);border:1px solid var(--tint-line)}
.stat-label{font-size:12.5px;color:#5D6B78}
.stat-value{font-size:23px;font-weight:600;letter-spacing:-.02em;margin-top:1px}
.stat.plain{background:#fff;border-color:var(--line)}
.stat.plain .stat-icon{background:var(--tint);border-color:var(--tint-line)}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-head{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--tint-head)}
.card-head.plain{background:#fff}
.card-title{font-size:14px;font-weight:600}
.card-head .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.card-body{padding:14px 15px}
.card-body.flush{padding:0}
.scroll-y{max-height:320px;overflow-y:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:#fff;border-radius:var(--r-sm);padding:8px 13px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.btn:hover{background:#F5F7FA}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-dark)}
.btn-danger{background:#fff;border-color:var(--bad-line);color:var(--bad)}
.btn-danger:hover{background:var(--bad-bg)}
.btn-sm{padding:6px 10px;font-size:12.5px}
.btn-soft{background:var(--info-bg);border:1px solid var(--info-line);color:var(--info);border-radius:20px;padding:4px 13px;font-size:11.5px;font-weight:500}
.btn-soft:hover{background:#CDE9F3}
.btn-icon{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.btn-icon:hover{background:#F1F4F8;border-color:var(--line);color:var(--ink)}
.btn-icon.danger:hover{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.btn-block{width:100%}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 10px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.b-green{background:var(--ok-bg);color:var(--ok);border-color:var(--ok-line)}
.b-blue{background:var(--brand-soft);color:var(--brand-dark);border-color:#C9DBFB}
.b-cyan{background:var(--info-bg);color:var(--info);border-color:var(--info-line)}
.b-amber{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.b-red{background:var(--bad-bg);color:var(--bad);border-color:var(--bad-line)}
.b-gray{background:#F1F4F8;color:#5B6675;border-color:var(--line-2)}
.tag{font-size:11.5px;padding:3px 9px;border-radius:6px;background:#F1F4F8;border:1px solid var(--line);color:#4C5666}

.avatar{border-radius:50%;display:grid;place-items:center;font-weight:600;color:#fff;flex:0 0 auto;letter-spacing:.02em;overflow:hidden}
.avatar.sq{border-radius:9px}

.list-row{display:flex;align-items:center;gap:11px;padding:10px 15px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.list-row:hover{background:#FAFBFD}
.list-main{min-width:0;flex:1}
.list-main b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-main span{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12.5px;font-weight:600;color:#495566;background:#F3F6F9;padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:middle}
tbody tr:hover{background:#FAFBFD}
tbody tr:last-child td{border-bottom:none}
.cell-user{display:flex;align-items:center;gap:10px}
.cell-user b{font-size:13px;font-weight:600}
.cell-sub{font-size:11.5px;color:var(--muted)}
.row-actions{display:flex;gap:2px}
.num{font-variant-numeric:tabular-nums}

.tabs{display:flex;gap:4px;background:#F3F6F9;border:1px solid var(--line);border-radius:8px;padding:4px;width:fit-content;max-width:100%;overflow-x:auto}
.tab{padding:6px 16px;border-radius:6px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.tab.active{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0}
.toolbar .grow{flex:1;min-width:120px}
.filter{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 11px;background:#fff;font-size:13px;color:var(--ink-2)}
.filter svg{color:var(--brand)}
.filter select,.filter input{border:none;background:none;font-size:13px;outline:none}
.mini-search{position:relative;min-width:220px;flex:1;max-width:340px}
.mini-search input{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:8px 12px 8px 34px;font-size:13px;background:#fff}
.mini-search input:focus{outline:none;border-color:#B9CDF6}
.mini-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}

.pagination{display:flex;align-items:center;gap:6px;padding:12px 15px;border-top:1px solid var(--line)}
.pagination .info{font-size:12.5px;color:var(--muted);margin-right:auto}
.page-btn{min-width:30px;height:30px;border:1px solid var(--line-2);border-radius:6px;display:grid;place-items:center;font-size:12.5px;color:var(--ink-2);padding:0 8px}
.page-btn:hover{background:#F5F7FA}
.page-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}
.page-btn[disabled]{opacity:.45;cursor:not-allowed}

.field{margin-bottom:13px}
.field label{display:block;font-size:12.5px;color:var(--ink-2);font-weight:500;margin-bottom:5px}
.input,.select,.textarea{width:100%;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 11px;font-size:13.5px;background:#fff}
.select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%237B8797' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:30px}
.textarea{min-height:82px;resize:vertical}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:#8FB3F5}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .full{grid-column:1/-1}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px}
.err{border-color:#E3A6A1!important}
.err-msg{font-size:11.5px;color:var(--bad);margin-top:4px}

.modal-back{position:fixed;inset:0;background:rgba(20,29,42,.46);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto}
.modal{background:#fff;border:1px solid var(--line);border-radius:12px;width:100%;max-width:560px;overflow:hidden}
.modal.wide{max-width:840px}
.modal.slim{max-width:420px}
.modal-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16px;font-weight:600}
.modal-head p{font-size:12px;color:var(--muted)}
.modal-body{padding:18px;max-height:calc(100vh - 210px);overflow-y:auto}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:13px 18px;border-top:1px solid var(--line);background:#FAFBFD}

.toasts{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:9px}
.toast{background:#fff;border:1px solid var(--line);border-left:3px solid var(--brand);border-radius:8px;padding:11px 15px;font-size:13px;min-width:250px;max-width:340px}
.toast.ok{border-left-color:#2FA36B}
.toast.bad{border-left-color:#D3574C}

.dash{display:grid;grid-template-columns:1.1fr 1fr 1.15fr;gap:14px;align-items:start}
.col{display:flex;flex-direction:column;gap:14px}
.cal-top{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cal-top .select{padding:6px 9px;font-size:12.5px;height:32px}
.cal-nav{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink-2)}
.cal-nav:hover{background:#F3F6F9}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:10px 12px 14px}
.cal-dow{text-align:center;font-size:11.5px;color:var(--muted);padding:5px 0}
.cal-day{height:32px;border-radius:7px;display:grid;place-items:center;font-size:12.5px;position:relative;color:var(--ink)}
.cal-day:hover{background:#F1F4F8}
.cal-day.mute{color:#C2C9D3}
.cal-day.today{border:1px solid var(--brand)}
.cal-day.sel{background:#232C39;color:#fff}
.cal-day .mark{position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:var(--brand)}
.cal-day.sel .mark{background:#fff}

.queue-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.queue-row:last-child{border-bottom:none}
.queue-row .t{margin-left:auto;font-size:12px;font-weight:600;color:var(--info)}
.quick a,.quick button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13px;color:var(--ink-2);margin-bottom:8px}
.quick button:last-child{margin-bottom:0}
.quick button:hover{background:#F6F9FB;border-color:var(--tint-line)}
.quick .chev{margin-left:auto;color:var(--muted)}
.quick .qi{width:28px;height:28px;border-radius:7px;background:var(--tint);border:1px solid var(--tint-line);display:grid;place-items:center;color:var(--info)}

.snap{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.snap-box{border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px}
.snap-box span{font-size:12px;color:var(--muted)}
.snap-box b{display:block;font-size:20px;font-weight:600;margin-top:2px}
.next-appt{background:var(--brand);color:#fff;border-radius:var(--r);padding:13px 14px}
.next-appt .row{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.next-appt .time{background:rgba(255,255,255,.2);border-radius:6px;padding:2px 9px;font-size:12.5px;font-weight:600}
.next-appt .in{margin-left:auto;font-size:11.5px;color:#D8E5FD}
.next-appt b{font-size:14px}
.next-appt small{display:block;font-size:11.5px;color:#D8E5FD;margin-top:2px}
.sched{display:flex;gap:12px;padding:9px 0}
.sched .tm{width:56px;flex:0 0 56px;font-size:11.5px;color:var(--muted);padding-top:9px;text-align:right}
.sched .bar{position:relative;padding-left:14px;flex:1}
.sched .bar:before{content:"";position:absolute;left:0;top:14px;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.sched .bar:after{content:"";position:absolute;left:3px;top:21px;bottom:-16px;width:1px;background:var(--line)}
.sched:last-child .bar:after{display:none}
.sched .box{border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 11px}
.sched .box b{font-size:12.5px;display:block}
.sched .box span{font-size:11.5px;color:var(--muted)}

.section-title{font-size:15px;font-weight:600;margin-bottom:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;align-items:start}
.side-grid{display:grid;grid-template-columns:1fr 312px;gap:14px;align-items:start}
.empty{padding:34px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.empty .btn{margin-top:12px}

.detail-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
.detail-item span{display:block;font-size:11.5px;color:var(--muted)}
.detail-item b{font-size:13.5px;font-weight:500}
.profile-head{display:flex;gap:14px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:16px}
.profile-head h3{font-size:17px;font-weight:600}
.profile-head p{font-size:12.5px;color:var(--muted)}
.subtabs{display:flex;gap:18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.subtab{padding:8px 2px;font-size:13px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.subtab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:500}

.chart{display:flex;align-items:flex-end;gap:12px;height:210px;padding:10px 4px 0}
.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}
.chart-bar{width:100%;max-width:38px;background:var(--brand);border-radius:6px 6px 0 0;min-height:3px;position:relative}
.chart-bar.alt{background:var(--teal)}
.chart-col small{font-size:11.5px;color:var(--muted)}
.chart-val{font-size:11px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink-2);padding:0 4px 4px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:6px}
.progress{height:7px;border-radius:6px;background:#EDF1F6;overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand);border-radius:6px}
.rank-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.rank-row:last-child{border-bottom:none}
.rank-row .rk{width:22px;height:22px;border-radius:6px;background:var(--tint);border:1px solid var(--tint-line);display:grid;place-items:center;font-size:11.5px;color:var(--info);font-weight:600}
.rank-row .grow{flex:1;min-width:0}
.rank-row b{font-size:13px;font-weight:500;display:block}

.thread-wrap{display:grid;grid-template-columns:300px 1fr;min-height:540px}
.thread-list{border-right:1px solid var(--line);overflow-y:auto;max-height:620px}
.thread-item{display:flex;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;align-items:flex-start}
.thread-item:hover{background:#FAFBFD}
.thread-item.active{background:var(--brand-soft)}
.thread-item .grow{min-width:0;flex:1}
.thread-item b{display:block;font-size:13px;font-weight:600}
.thread-item p{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unread{width:8px;height:8px;border-radius:50%;background:var(--brand);margin-top:6px}
.chat{display:flex;flex-direction:column;max-height:620px}
.chat-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#FAFBFD}
.bubble{max-width:74%;padding:9px 13px;border-radius:12px;font-size:13px;border:1px solid var(--line);background:#fff}
.bubble time{display:block;font-size:10.5px;color:var(--muted);margin-top:4px}
.bubble.me{align-self:flex-end;background:var(--brand);border-color:var(--brand);color:#fff}
.bubble.me time{color:#D6E4FD}
.chat-foot{display:flex;gap:9px;padding:12px 14px;border-top:1px solid var(--line);background:#fff}

.inv-level{display:flex;align-items:center;gap:9px;min-width:150px}
.inv-level .progress{flex:1}
.settings-grid{display:grid;grid-template-columns:210px 1fr;gap:14px;align-items:start}
.set-nav{display:flex;flex-direction:column;gap:6px}
.set-nav button{text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:13px;color:var(--ink-2);background:#fff}
.set-nav button.active{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:500}
.switch{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.switch:last-child{border-bottom:none}
.switch b{display:block;font-size:13.5px;font-weight:500}
.switch span{font-size:12px;color:var(--muted)}
.toggle{width:42px;height:24px;border-radius:20px;background:#D7DEE8;position:relative;flex:0 0 42px;transition:background .15s}
.toggle i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s}
.toggle.on{background:var(--brand)}
.toggle.on i{left:21px}

.login-art{position:relative;padding:38px 34px;min-height:480px;display:flex;flex-direction:column;justify-content:space-between;gap:24px;background:linear-gradient(155deg,rgba(36,80,86,.58),rgba(31,71,77,.86));color:#fff}
.login-mark{display:flex;align-items:center;gap:13px}
.login-mark svg{color:#D6E9EA}
.login-word{font-family:Georgia,"Times New Roman",serif;font-size:36px;line-height:1;letter-spacing:.01em}
.login-sub{font-family:Georgia,"Times New Roman",serif;font-size:13px;letter-spacing:.26em;color:#C8DEDF;margin-top:7px}
.login-art h4{font-size:15px;font-weight:600;margin-bottom:6px}
.login-art p{font-size:13px;line-height:1.65;color:#DCEBEC}
.login-line{height:1px;background:rgba(255,255,255,.28);margin:16px 0}
.login-contact{display:flex;align-items:center;gap:9px;font-size:13px;color:#fff;margin-top:7px}
.login-contact svg{flex:0 0 16px;color:#BFDDDF}
.login-form{background:rgba(255,255,255,.97);padding:42px 38px;display:flex;flex-direction:column;justify-content:center}
.login-form h2{font-size:21px;font-weight:600;letter-spacing:-.01em}
.login-form .lead{font-size:13px;color:var(--muted);margin:5px 0 20px}
.login-error{display:flex;align-items:center;gap:8px;background:var(--bad-bg);border:1px solid var(--bad-line);color:var(--bad);border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:15px}
.login-error svg{flex:0 0 16px}
.btn-teal{background:#3B6F76;border-color:#3B6F76;color:#fff;padding:11px 13px;font-size:14px}
.btn-teal:hover{background:#2F5C62}
.login-note{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}
.auth-switch{display:flex;justify-content:center;gap:5px;margin:12px 0 0}
.auth-switch button{border:0;background:transparent;color:#35676D;font:inherit;font-size:12px;cursor:pointer;padding:5px}
.auth-switch button:hover{text-decoration:underline}
.auth-switch button.active{font-weight:600}
.auth-switch button{border:0;border-radius:6px;padding:8px;background:transparent;color:var(--muted);font:inherit;font-size:13px;cursor:pointer}
.auth-switch button.active{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.auth-divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;margin:15px 0}
.auth-divider:before,.auth-divider:after{content:"";height:1px;background:var(--line);flex:1}
.auth-google{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:#30343B;border:1px solid #D7DEDF;padding:10px;font-weight:500}
.auth-phone{display:grid;grid-template-columns:1fr;gap:10px}
.auth-phone-toggle{width:100%;margin-top:9px;background:#fff;color:#35676D;border:1px solid #D7DEDF;padding:10px}
.auth-status{min-height:18px;font-size:12px;line-height:1.5;color:var(--muted);margin:8px 0}
.auth-status.error{color:var(--bad)}
.auth-status.success{color:var(--ok)}
.auth-resend{border:0;background:transparent;color:#35676D;font:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:7px}
.auth-resend:disabled{color:var(--muted);cursor:default;text-decoration:none}
.auth-unavailable{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0}
.auth-otp{letter-spacing:.3em;text-align:center;font-size:18px}
.auth-google:disabled,.auth-phone button:disabled,.otp-controls button:disabled{opacity:.6;cursor:wait}
.otp-controls{display:grid;gap:10px}
.otp-controls[hidden]{display:none}
.global-status{position:fixed;top:0;left:50%;transform:translateX(-50%);z-index:500;max-width:min(680px,calc(100% - 24px));padding:8px 14px;border:1px solid var(--info-line);border-top:0;border-radius:0 0 8px 8px;background:var(--info-bg);color:var(--info);font-size:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.global-status[hidden]{display:none}
.global-status.error{background:var(--bad-bg);border-color:var(--bad-line);color:var(--bad)}
.global-status button{margin-left:8px;color:inherit;text-decoration:underline;font-weight:600}
@media(max-width:860px){.login-card{grid-template-columns:1fr;max-width:460px}.login-art{min-height:0;padding:26px 24px}.login-form{padding:28px 24px}}

@media print{
body *{visibility:hidden}
.modal-back,.modal-back *{visibility:visible}
.modal-back{position:absolute;inset:0;background:#fff;padding:0;display:block;overflow:visible}
.modal{max-width:100%;border:none;border-radius:0}
.modal-head,.modal-foot{display:none}
.modal-body{max-height:none;overflow:visible;padding:0}
}
@media(max-width:1240px){.dash{grid-template-columns:1fr 1fr}.dash .col:last-child{grid-column:1/-1}.dash .col:last-child .card{width:100%}}
@media(max-width:1080px){.stats{grid-template-columns:repeat(2,1fr)}.side-grid{grid-template-columns:1fr}.three{grid-template-columns:1fr}}
@media(max-width:900px){
.sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s}
body.nav-open .sidebar{transform:none}
.hamburger{display:grid}
.dash{grid-template-columns:1fr}
.two{grid-template-columns:1fr}
.thread-wrap{grid-template-columns:1fr}
.thread-list{max-height:230px;border-right:none;border-bottom:1px solid var(--line)}
.settings-grid{grid-template-columns:1fr}
.set-nav{flex-direction:row;overflow-x:auto}
.page-title{font-size:17px}
}
@media(max-width:640px){
.stats{grid-template-columns:1fr}
.view{padding:14px 14px 34px}
.topbar{padding:10px 14px;gap:10px;flex-wrap:wrap}
.form-grid{grid-template-columns:1fr}
.user-meta{display:none}
.detail-grid{grid-template-columns:1fr}
}

<script>
let activeFetches=0;
let slowFetches=0;
let networkError='';
let networkErrorTimer=null;
function showGlobalStatus(message,kind,action){
  const element=document.getElementById('globalStatus');if(!element)return;
  element.classList.toggle('error',kind==='error');
  element.innerHTML=esc(message)+(action?'<button type="button" data-action="'+action+'">Retry</button>':'');
  element.hidden=!message;
}
window.fetch=(function(nativeFetch){
  return function(input,options){
    activeFetches++;
    let markedSlow=false;
    const timer=setTimeout(function(){
      markedSlow=true;slowFetches++;
      showGlobalStatus('The server is taking longer than usual. Please wait.','info');
    },1800);
    return nativeFetch(input,options).catch(function(error){
      networkError=!navigator.onLine
        ?'You are offline. Your saved clinic data remains available on this device.'
        :'Could not reach the server. Check your connection and retry your action.';
      showGlobalStatus(networkError,'error');
      clearTimeout(networkErrorTimer);
      networkErrorTimer=setTimeout(function(){
        networkError='';
        if(navigator.onLine&&!slowFetches&&!activeFetches)showGlobalStatus('','info');
      },6000);
      throw error;
    }).then(function(response){
      networkError='';
      return response;
    }).finally(function(){
      clearTimeout(timer);
      activeFetches=Math.max(0,activeFetches-1);
      if(markedSlow)slowFetches=Math.max(0,slowFetches-1);
      if(!slowFetches){
        if(!navigator.onLine)showGlobalStatus('You are offline. Your saved clinic data remains available on this device.','error');
        else if(networkError)showGlobalStatus(networkError,'error');
        else if(!activeFetches)showGlobalStatus('','info');
      }
    });
  };
})(window.fetch.bind(window));
window.addEventListener('offline',function(){
  showGlobalStatus('You are offline. Your saved clinic data remains available on this device.','error');
});
window.addEventListener('online',function(){
  networkError='';
  clearTimeout(networkErrorTimer);
  showGlobalStatus('Connection restored. Retrying pending changes...','info');
  if(UI.signedIn)syncState(0);
});

let syncTimer=null;
let syncAttempt=0;
function syncState(attempt){
  fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({state:DB})})
    .then(function(r){
      if(r.status===401){UI.signedIn=false;showGlobalStatus('Your session expired. Sign in again to sync clinic data.','error');renderLogin();return;}
      if(!r.ok)throw new Error('Changes could not be saved to the server.');
      syncAttempt=0;
      showGlobalStatus('','info');
    })
    .catch(function(){
      syncAttempt=typeof attempt==='number'?attempt+1:syncAttempt+1;
      if(syncAttempt<=5){
        const delay=[2000,5000,15000,30000,60000][syncAttempt-1];
        showGlobalStatus('Changes are saved on this device and will be synced automatically.','error','sync-retry');
        syncTimer=setTimeout(function(){syncState(syncAttempt);},delay);
      }else{
        showGlobalStatus('Changes remain saved on this device. Server sync is paused.','error','sync-retry');
      }
    });
}
function invoiceApi(url,method,payload){
  const options={
    method:method||'GET', 
    credentials:'same-origin',
    headers:{}
  };

  if(payload!==undefined){
    options.headers['Content-Type']='application/json';
    options.body=JSON.stringify(payload);
  }

  return fetch(url,options).then(function(r){
    return r.text().then(function(text){
      let body={};

      try{
        body=text?JSON.parse(text):{};
      }catch(e){
        body={
          error:{
            message:text||'Invalid server response'
          }
        };
      }

      if(!r.ok){
        const msg=
          body&&body.error&&body.error.message
          ?body.error.message
          :'Billing request failed ('+r.status+').';

        const err=new Error(msg);
        err.status=r.status;
        throw err;
      }

      return body;
    });
  });
}

}

  }
  UI.route=route;
  UI.menu=null;
  document.body.classList.remove('nav-open');
  window.scrollTo(0,0);

  if(route==='billing'&&UI.signedIn){
    refreshInvoices()
    .then(function(){
      render();
    })
    .catch(function(err){
      render();
      toast(err.message,'bad');
    });
    return;
  }
  render();
}

window.completeClinicSignIn=function(user){
  UI.loginError='';UI.signedIn=true;UI.authUser=user||null;
  return fetch('/api/state',{credentials:'same-origin'})
    .then(function(response){return response.json().then(function(body){return {ok:response.ok,body:body};});})
    .then(function(result){
      if(!result.ok||!result.body.state)throw new Error((result.body.error&&result.body.error.message)||'Could not load clinic data.');
      DB=result.body.state;saveLocal();$('#loginRoot').innerHTML='';render();

let modalStack=[];
function openModal(opts){

  back.addEventListener('mousedown',e=>{if(e.target===back)closeModal();});
  $('#overlays').appendChild(back);modalStack.push(back);
  const f=back.querySelector('input,select,textarea');if(f&&opts.focus!==false)setTimeout(()=>f.focus(),30);

}

function toast(msg,type){

function formVals(scope){
  const out={};
  $$('[data-field]',scope).forEach(el=>{
    if(el.type==='checkbox')out[el.dataset.field]=el.checked;
    else out[el.dataset.field]=el.value.trim();
  });
  return out;
}
function markError(scope,field,msg){
  const el=$('[data-field="'+field+'"]',scope);if(!el)return;
  el.classList.add('err');
  const p=document.createElement('div');p.className='err-msg';p.textContent=msg;
  if(!el.parentNode.querySelector('.err-msg'))el.parentNode.appendChild(p);
}
function clearErrors(scope){$$('.err',scope).forEach(e=>e.classList.remove('err'));$$('.err-msg',scope).forEach(e=>e.remove());}
function required(scope,fields){
  clearErrors(scope);const v=formVals(scope);let ok=true;
  fields.forEach(f=>{if(!v[f]){markError(scope,f,'This field is required');ok=false;}});
  return ok?v:null;
}
function paginate(list,st){
  const pages=Math.max(1,Math.ceil(list.length/st.per));
  if(st.page>pages)st.page=pages;
  const start=(st.page-1)*st.per;
  return{rows:list.slice(start,start+st.per),pages:pages,start:start,total:list.length};
}
function pager(p,key){
  if(p.total===0)return '';
  let btns='';
  const max=Math.min(p.pages,5);let first=Math.max(1,Math.min(p.pages-max+1,(UI[key].page||1)-2));
  for(let i=first;i<first+max;i++)btns+='<button class="page-btn'+(UI[key].page===i?' active':'')+'" data-action="page" data-key="'+key+'" data-page="'+i+'">'+i+'</button>';
  return '<div class="pagination"><span class="info">Showing '+(p.start+1)+'-'+(p.start+p.rows.length)+' of '+p.total+' results</span>'+
  '<button class="page-btn" data-action="page" data-key="'+key+'" data-page="'+(UI[key].page-1)+'"'+(UI[key].page<=1?' disabled':'')+'>'+icon('chevLeft',14)+'</button>'+btns+
  '<button class="page-btn" data-action="page" data-key="'+key+'" data-page="'+(UI[key].page+1)+'"'+(UI[key].page>=p.pages?' disabled':'')+'>'+icon('chev',14)+'</button></div>';
}
function emptyRow(cols,text,action,label){
  return '<tr><td colspan="'+cols+'"><div class="empty"><b>'+esc(text)+'</b><span>Adjust your filters or add a new record to get started.</span>'+(action?'<div><button class="btn btn-primary btn-sm" data-action="'+action+'">'+icon('plus',15)+esc(label)+'</button></div>':'')+'</div></td></tr>';

function selectOptions(list,val,valueKey,labelKey){
  return list.map(o=>{
    const v=valueKey?o[valueKey]:o,l=labelKey?o[labelKey]:o;
    return '<option value="'+esc(v)+'"'+(String(v)===String(val)?' selected':'')+'>'+esc(l)+'</option>';
  }).join('');
}
function toCSV(rows){
  return rows.map(r=>r.map(c=>{const s=String(c==null?'':c);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',')).join('\n');
}
function downloadCSV(name,rows){
  const blob=new Blob([toCSV(rows)],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},200);
  toast('Exported '+name);
}

function calWidget(){
  const y=UI.calYear,m=UI.calMonth;
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const marks={};
  DB.appointments.forEach(a=>{if(a.status!=='Cancelled')marks[a.date]=true;});
  let cells='';
  DOW.forEach(d=>cells+='<div class="cal-dow">'+d+'</div>');
  for(let i=first-1;i>=0;i--)cells+='<div class="cal-day mute">'+(prevDays-i)+'</div>';
  for(let d=1;d<=days;d++){
    const ds=y+'-'+pad(m+1)+'-'+pad(d);
    const cls=['cal-day'];
    if(ds===today())cls.push('today');
    if(ds===UI.calSelected)cls.push('sel');
    cells+='<button class="'+cls.join(' ')+'" data-action="cal-pick" data-date="'+ds+'">'+d+(marks[ds]?'<i class="mark"></i>':'')+'</button>';
  }
  const rest=(7-((first+days)%7))%7;
  for(let i=1;i<=rest;i++)cells+='<div class="cal-day mute">'+i+'</div>';
  const years=[];for(let i=new Date().getFullYear()-3;i<=new Date().getFullYear()+3;i++)years.push(i);

    '<button class="cal-nav" data-action="cal-prev">'+icon('chevLeft',15)+'</button>'+

}

function filteredAppts(){

}

VIEWS.calendar=function(){
  const y=UI.pageCal.y,m=UI.pageCal.m;
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const prevDays=new Date(y,m,0).getDate();
  const byDate={};
  DB.appointments.forEach(a=>{(byDate[a.date]=byDate[a.date]||[]).push(a);});
  let cells=DOW.map(d=>'<div style="text-align:center;font-size:12px;color:var(--muted);padding:8px 0;font-weight:500">'+d+'</div>').join('');
  const cell=(label,ds,mute)=>{
    const items=(byDate[ds]||[]).filter(a=>a.status!=='Cancelled').sort(sortByDateTime);
    const chips=items.slice(0,3).map(a=>'<div style="font-size:10.5px;background:var(--brand-soft);border:1px solid #C9DBFB;color:var(--brand-dark);border-radius:5px;padding:2px 5px;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+fmtTime(a.time).replace(':00','')+' '+esc(pName(a.patientId).split(' ')[0])+'</div>').join('');
    const more=items.length>3?'<div style="font-size:10.5px;color:var(--muted)">+'+(items.length-3)+' more</div>':'';
    return '<button style="text-align:left;border:1px solid '+(ds===today()?'var(--brand)':'var(--line)')+';border-radius:8px;min-height:104px;padding:7px 8px;background:'+(mute?'#FAFBFD':'#fff')+';display:block;width:100%" data-action="cal-day-open" data-date="'+ds+'">'+
    '<div style="font-size:12px;font-weight:600;color:'+(mute?'#BFC7D2':'var(--ink)')+';margin-bottom:5px">'+label+'</div>'+chips+more+'</button>';
  };
  for(let i=first-1;i>=0;i--){const d=new Date(y,m-1,prevDays-i);cells+=cell(prevDays-i,iso(d),true);}
  for(let d=1;d<=days;d++)cells+=cell(d,y+'-'+pad(m+1)+'-'+pad(d),false);
  const rest=(7-((first+days)%7))%7;
  for(let i=1;i<=rest;i++){const d=new Date(y,m+1,i);cells+=cell(i,iso(d),true);}
  const monthAppts=DB.appointments.filter(a=>{const d=parseISO(a.date);return d.getMonth()===m&&d.getFullYear()===y;});
  const years=[];for(let i=new Date().getFullYear()-3;i<=new Date().getFullYear()+3;i++)years.push(i);
  return '<div class="toolbar" style="margin-top:0">'+
    '<button class="cal-nav" data-action="page-cal-prev">'+icon('chevLeft',15)+'</button>'+
    '<h2 style="font-size:17px;font-weight:600;min-width:190px">'+MONTHS[m]+' '+y+'</h2>'+
    '<button class="cal-nav" data-action="page-cal-next">'+icon('chev',15)+'</button>'+
    '<button class="btn" data-action="page-cal-today">Today</button>'+
    '<label class="filter">Month<select data-action="page-cal-month">'+MONTHS.map((n,i)=>'<option value="'+i+'"'+(i===m?' selected':'')+'>'+n+'</option>').join('')+'</select></label>'+
    '<label class="filter">Year<select data-action="page-cal-year">'+years.map(v=>'<option value="'+v+'"'+(v===y?' selected':'')+'>'+v+'</option>').join('')+'</select></label>'+
    '<div class="grow"></div>'+
    '<span class="tag">'+monthAppts.filter(a=>a.status!=='Cancelled').length+' appointments this month</span>'+
    '<button class="btn btn-primary" data-action="appt-new">'+icon('plus',16)+'Add Appointment</button>'+
  '</div>'+
  '<div class="card"><div class="card-body"><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px">'+cells+'</div></div></div>';
};

function monthKeys(n){
  const out=[];const d=new Date();d.setDate(1);
  for(let i=n-1;i>=0;i--){const x=new Date(d.getFullYear(),d.getMonth()-i,1);out.push({y:x.getFullYear(),m:x.getMonth(),label:MON[x.getMonth()]});}
  return out;
}
VIEWS.reports=function(){
  const months=monthKeys(UI.reports.range==='12m'?12:6);
  const data=months.map(k=>{
    const rev=DB.invoices.filter(v=>{const d=parseISO(v.date);return d.getMonth()===k.m&&d.getFullYear()===k.y;}).reduce((s,v)=>s+v.paid,0);
    const tr=DB.treatments.filter(t=>{const d=parseISO(t.date);return d.getMonth()===k.m&&d.getFullYear()===k.y;}).length;
    const ap=DB.appointments.filter(a=>{const d=parseISO(a.date);return d.getMonth()===k.m&&d.getFullYear()===k.y;}).length;
    return{label:k.label,rev:rev,tr:tr,ap:ap};
  });
  const maxRev=Math.max.apply(null,data.map(d=>d.rev).concat([1]));
  const bars=data.map(d=>'<div class="chart-col"><span class="chart-val">'+(d.rev?Math.round(d.rev/1000)+'k':'0')+'</span><div class="chart-bar" style="height:'+Math.max(3,Math.round(d.rev/maxRev*150))+'px"></div><small>'+d.label+'</small></div>').join('');
  const maxAp=Math.max.apply(null,data.map(d=>d.ap).concat([1]));
  const bars2=data.map(d=>'<div class="chart-col"><span class="chart-val">'+d.ap+'</span><div class="chart-bar alt" style="height:'+Math.max(3,Math.round(d.ap/maxAp*150))+'px"></div><small>'+d.label+'</small></div>').join('');

  const counts={};
  DB.treatments.forEach(t=>{counts[t.procedure]=(counts[t.procedure]||0)+1;});
  const top=Object.keys(counts).map(k=>({name:k,n:counts[k]})).sort((a,b)=>b.n-a.n).slice(0,6);
  const maxTop=top.length?top[0].n:1;
  const topRows=top.map((t,i)=>'<div class="rank-row"><span class="rk">'+(i+1)+'</span><div class="grow"><b>'+esc(t.name)+'</b><div class="progress" style="margin-top:5px"><i style="width:'+Math.round(t.n/maxTop*100)+'%"></i></div></div><span class="num" style="font-size:12.5px;color:var(--muted)">'+t.n+'</span></div>').join('');

  const docStats=DB.doctors.filter(d=>d.role==='Dentist'||d.role==='Administrator').map(d=>{
    const ap=DB.appointments.filter(a=>a.doctorId===d.id).length;
    const tr=DB.treatments.filter(t=>t.doctorId===d.id);
    return{name:d.name,ap:ap,tr:tr.length,value:tr.reduce((s,t)=>s+t.cost,0)};
  }).sort((a,b)=>b.value-a.value);
  const docRows=docStats.map(d=>'<tr><td><div class="cell-user">'+avatar(d.name,30)+'<b>'+esc(d.name)+'</b></div></td><td class="num">'+d.ap+'</td><td class="num">'+d.tr+'</td><td class="num">'+money(d.value)+'</td></tr>').join('');

  const now=new Date();
  const revMonth=DB.invoices.filter(v=>sameMonth(v.date,now)).reduce((s,v)=>s+v.paid,0);
  const completed=DB.appointments.filter(a=>a.status==='Completed').length;
  const cancelled=DB.appointments.filter(a=>a.status==='Cancelled').length;
  const rate=DB.appointments.length?Math.round(completed/DB.appointments.length*100):0;
  const newPatients=DB.patients.filter(p=>sameMonth(p.lastVisit,now)).length;
  const stats=[['money','Revenue this month',money0(revMonth)],['check','Completion rate',rate+'%'],['users','Patients seen this month',newPatients],['alert','Cancellations',cancelled]]
    .map(s=>'<div class="stat plain"><div class="stat-icon">'+icon(s[0],20)+'</div><div><div class="stat-label">'+s[1]+'</div><div class="stat-value num">'+s[2]+'</div></div></div>').join('');

  const statusMix=['Confirmed','Pending','Completed','Cancelled'].map(s=>{
    const n=DB.appointments.filter(a=>a.status===s).length;
    const pct=DB.appointments.length?Math.round(n/DB.appointments.length*100):0;
    return '<div style="margin-bottom:11px"><div style="display:flex;font-size:12.5px;margin-bottom:5px"><span>'+s+'</span><span class="num" style="margin-left:auto;color:var(--muted)">'+n+' · '+pct+'%</span></div><div class="progress"><i style="width:'+pct+'%"></i></div></div>';
  }).join('');

  return '<div class="stats">'+stats+'</div>'+
  '<div class="toolbar" style="margin-top:0">'+
    '<label class="filter">Period<select data-action="reports-range">'+selectOptions([{v:'6m',l:'Last 6 months'},{v:'12m',l:'Last 12 months'}],UI.reports.range,'v','l')+'</select></label>'+
    '<div class="grow"></div>'+
    '<button class="btn" data-action="report-export">'+icon('download',16)+'Export summary</button>'+
    '<button class="btn btn-primary" data-action="report-generate">'+icon('file',16)+'Generate Report</button>'+
  '</div>'+
  '<div class="two">'+
    '<div class="card"><div class="card-head plain"><span class="card-title">Revenue collected</span><span class="right tag">'+money0(data.reduce((s,d)=>s+d.rev,0))+' total</span></div><div class="card-body"><div class="legend"><span><i style="background:var(--brand)"></i>Payments received per month</span></div><div class="chart">'+bars+'</div></div></div>'+
    '<div class="card"><div class="card-head plain"><span class="card-title">Appointment volume</span></div><div class="card-body"><div class="legend"><span><i style="background:var(--teal)"></i>Appointments booked per month</span></div><div class="chart">'+bars2+'</div></div></div>'+
  '</div>'+
  '<div class="two" style="margin-top:14px">'+
    '<div class="card"><div class="card-head plain"><span class="card-title">Most performed procedures</span></div><div class="card-body">'+(topRows||'<div class="empty"><b>No treatment data</b></div>')+'</div></div>'+
    '<div class="card"><div class="card-head plain"><span class="card-title">Appointment status mix</span></div><div class="card-body">'+statusMix+'</div></div>'+
  '</div>'+
  '<div class="card" style="margin-top:14px"><div class="card-head plain"><span class="card-title">Clinician performance</span></div>'+
  '<div class="table-wrap"><table><thead><tr><th>Clinician</th><th>Appointments</th><th>Treatments</th><th>Treatment value</th></tr></thead><tbody>'+docRows+'</tbody></table></div></div>';
};
function sortedInventory(){
  const st=UI.inv;
  let list=DB.inventory.slice();
  if(st.category!=='All')list=list.filter(i=>i.category===st.category);
  if(st.q){const q=st.q.toLowerCase();list=list.filter(i=>(i.name+' '+i.id+' '+i.supplier).toLowerCase().includes(q));}
  return list.sort((a,b)=>a.name.localeCompare(b.name));
}

  if(DB.patients.length)return true;
  openModal({title:'No patients yet',size:'slim',focus:false,
    body:'<div class="empty"><b>Add a patient first</b><span>Appointments, treatments, invoices, prescriptions and messages are all linked to a patient record.</span></div>',
    footer:'<button class="btn" data-action="modal-close">Close</button><button class="btn btn-primary" data-action="patient-new">'+icon('plus',15)+'Add patient</button>'});
  return false;
}
function fld(label,html,full){return '<div class="field'+(full?' full':'')+'"><label>'+label+'</label>'+html+'</div>';}
function inputF(name,val,type,attrs){return '<input class="input" data-field="'+name+'" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'" '+(attrs||'')+'>';}
function selectF(name,list,val,vk,lk){return '<select class="select" data-field="'+name+'">'+selectOptions(list,val,vk,lk)+'</select>';}
function textF(name,val){return '<textarea class="textarea" data-field="'+name+'">'+esc(val||'')+'</textarea>';}
function patientOptions(val){return selectOptions(DB.patients.slice().sort((a,b)=>a.name.localeCompare(b.name)),val,'id','name');}
function dentistList(){return DB.doctors.filter(d=>d.role==='Dentist'||d.role==='Administrator');}

function splitLegacyName(name){
  const s=String(name||'').trim();if(!s)return{firstName:'',mi:'',surname:''};
  const w=s.split(/\s+/);if(w.length===1)return{firstName:w[0],mi:'',surname:''};
  return{firstName:w[0],mi:'',surname:w.slice(1).join(' ')};
}
function composeName(first,mi,surname){
  const m=String(mi||'').replace(/\.+$/,'').trim();
  return [first,m?m+'.':'',surname].filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
}
function chartRow(teeth,suffix,label,p,editable){
  return '<tr><td style="border:1px solid var(--line-2);padding:3px 6px;font-size:10.5px;font-weight:500;color:var(--ink-2);white-space:nowrap">'+label+'</td>'+
    teeth.map(n=>'<td style="border:1px solid var(--line-2);padding:2px;text-align:center">'+
      (editable?'<input class="input" data-field="t'+n+suffix+'" value="'+esc(p['t'+n+suffix]||'')+'" maxlength="4" style="border:none;padding:2px 0;font-size:10.5px;text-align:center;background:transparent">':
      '<span style="font-size:10.5px">'+esc(p['t'+n+suffix]||' ')+'</span>')+
    '</td>').join('')+'</tr>';
}
function toothChart(teeth,label,p,editable){
  return '<div style="font-size:11.5px;font-weight:600;color:var(--ink-2);margin:8px 0 4px">'+label+'</div>'+
    '<table style="width:100%;border-collapse:collapse;margin-bottom:6px"><thead><tr><th style="border:1px solid var(--line-2);background:#F3F6F9;padding:3px 6px;font-size:10px"></th>'+
    teeth.map(n=>'<th style="border:1px solid var(--line-2);background:#F3F6F9;padding:3px 2px;font-size:10px">'+n+'</th>').join('')+'</tr></thead><tbody>'+
    chartRow(teeth,'o','Operation',p,editable)+chartRow(teeth,'c','Condition',p,editable)+
    '</tbody></table>';
}

function timeOptions(val){
  const out=[];const s=DB.settings;
  const start=+s.openTime.split(':')[0]*60+ +s.openTime.split(':')[1];
  const end=+s.closeTime.split(':')[0]*60+ +s.closeTime.split(':')[1];
  for(let t=start;t<end;t+=+s.slotMinutes)out.push({v:pad(Math.floor(t/60))+':'+pad(t%60),l:fmtTime(pad(Math.floor(t/60))+':'+pad(t%60))});
  if(val&&!out.some(o=>o.v===val))out.unshift({v:val,l:fmtTime(val)});
  return selectOptions(out,val,'v','l');
}

async function submitAccountCreate(){
  if(!isAdmin()){toast('Administrator access is required.','bad');return;}
  const modal=currentModal();
  const values=required(modal,['name','username','email','role','password']);
  if(!values)return;
  const button=$('[data-action="account-create-save"]',modal);
  if(button){button.disabled=true;button.textContent='Creating account...';}
  try{
    const response=await fetch('/api/admin/accounts',{
      method:'POST',
      credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(values)
    });
    const body=await response.json();
    if(!response.ok)throw new Error(body&&body.error&&body.error.message||'The account could not be created.');
    closeModal();
    toast('Account created for '+body.account.name);
  }catch(error){
    toast(error.message||'The account could not be created.','bad');
    if(button&&button.isConnected){button.disabled=false;button.textContent='Create account';}
  }

let signInBusy=false;
function signIn(){
  if(signInBusy)return;
  const u=$('#loginUser'),p=$('#loginPass');
  const user=u?u.value.trim():'',pass=p?p.value:'';
  UI.loginUser=user;
  if(!user){UI.loginError='Enter your username or email to continue.';renderLogin();return;}
  if(!pass){UI.loginError='Enter your password to continue.';renderLogin();return;}
  signInBusy=true;
  const submit=document.querySelector('[data-action="sign-in"]');
  if(submit){submit.disabled=true;submit.textContent='Signing in...';}
  fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:user,password:pass})})
    .then(function(r){return r.json().then(function(body){return {status:r.status,body:body};});})
    .then(function(res){
      if(res.status!==200){
        UI.loginError=(res.body&&res.body.error&&res.body.error.message)||'Incorrect username or password. Please try again.';
        renderLogin();
        return;
      }
      return window.completeClinicSignIn(res.body.user);
    })
    .catch(function(error){UI.loginError=error.message||'Could not reach the server. Check your connection and try again.';renderLogin();})
    .finally(function(){
      signInBusy=false;
      if(submit&&submit.isConnected){submit.disabled=false;submit.textContent='Sign in';}
    });
}

function collectItemsRaw(scope){
  const rows={};
  $$('[data-item]',scope).forEach(el=>{
    const i=el.dataset.i;rows[i]=rows[i]||{desc:'',qty:1,price:0};
    rows[i][el.dataset.item]=el.dataset.item==='desc'?el.value.trim():Number(el.value||0);
  });
  return Object.keys(rows).map(k=>rows[k]);
}
function collectItems(scope){return collectItemsRaw(scope).filter(r=>r.desc);}
function collectMedsRaw(scope){
  const rows={};
  $$('[data-med]',scope).forEach(el=>{
    const i=el.dataset.i;rows[i]=rows[i]||{name:'',dosage:'',frequency:'',duration:''};
    rows[i][el.dataset.med]=el.value.trim();
  });
  return Object.keys(rows).map(k=>rows[k]);
}
function collectMeds(scope){return collectMedsRaw(scope).filter(r=>r.name);}

  const newId=nextId('RX-','rx');

  saveDB();
  return newId;
}

  'rx-med-remove':d=>{TMP.meds=collectMedsRaw(currentModal());TMP.meds.splice(+d.i,1);if(!TMP.meds.length)TMP.meds.push({name:'',dosage:'',frequency:'',duration:''});$('#medRows',currentModal()).innerHTML=medRowsHTML();},
  'rx-save':d=>{
    const isNew=!d.id;const id=saveRx(d.id);if(!id)return;
    closeModal();render();toast(isNew?'Prescription issued':'Prescription updated');
  },
  'rx-print-new':d=>{
    const id=saveRx(d.id);if(!id)return;
    closeAllModals();rxPrintView(id);setTimeout(()=>window.print(),150);
  },
  'rx-delete':d=>{
    confirmDialog('Delete prescription','Remove prescription '+d.id+'?',()=>{
      DB.prescriptions=DB.prescriptions.filter(x=>x.id!==d.id);saveDB();closeAllModals();render();toast('Prescription deleted','bad');});
  },

  'report-generate':()=>reportModal(),
  'report-export':()=>{
    const now=new Date();
    const months=monthKeys(UI.reports.range==='12m'?12:6);
    const rows=[['Month','Appointments','Treatments','Payments collected']];
    months.forEach(k=>{
      const ap=DB.appointments.filter(a=>{const d=parseISO(a.date);return d.getMonth()===k.m&&d.getFullYear()===k.y;}).length;
      const tr=DB.treatments.filter(t=>{const d=parseISO(t.date);return d.getMonth()===k.m&&d.getFullYear()===k.y;}).length;
      const rev=DB.invoices.filter(v=>{const d=parseISO(v.date);return d.getMonth()===k.m&&d.getFullYear()===k.y;}).reduce((s,v)=>s+v.paid,0);
      rows.push([k.label+' '+k.y,ap,tr,rev]);
    });
    downloadCSV('clinic-summary.csv',rows);
  },

  'item-new':()=>itemForm(),
  'item-edit':d=>{closeAllModals();itemForm(d.id);},
  'item-save':d=>{
    const m=currentModal();const v=required(m,['name']);if(!v)return;
    v.qty=+v.qty||0;v.reorder=+v.reorder||0;v.unitCost=+v.unitCost||0;v.expiry=v.expiry||'—';
    if(d.id)Object.assign(byId(DB.inventory,d.id),v);
    else{
      const id='IT-'+(100+DB.inventory.length+1);
      DB.inventory.push(Object.assign({id:id},v));
      Object.assign(UI.inv,{q:'',category:'All'});
      focusRecord('inventory','inv',sortedInventory(),id);
    }
    saveDB();closeModal();render();toast('Inventory item saved');
  },
  'item-restock':d=>{closeAllModals();restockForm(d.id);},
  'restock-save':d=>{
    const m=currentModal();const v=formVals(m);
    const it=byId(DB.inventory,d.id);const q=+v.qty||0;
    if(q<=0){markError(m,'qty','Enter a quantity greater than zero');return;}
    it.qty+=q;saveDB();closeModal();render();toast(q+' '+it.unit+' added to '+it.name);
  },
  'item-delete':d=>{
    const it=byId(DB.inventory,d.id);if(!it)return;
    confirmDialog('Delete item','Remove '+it.name+' from inventory?',()=>{
      DB.inventory=DB.inventory.filter(x=>x.id!==d.id);saveDB();closeAllModals();render();toast('Item removed','bad');});
  },
  'inv-export':()=>{
    const rows=[['Code','Item','Category','Quantity','Unit','Reorder level','Unit cost','Supplier','Expiry']];
    DB.inventory.forEach(i=>rows.push([i.id,i.name,i.category,i.qty,i.unit,i.reorder,i.unitCost,i.supplier,i.expiry]));
    downloadCSV('inventory.csv',rows);
  },

  'msg-open':d=>{UI.msg.active=d.id;const t=byId(DB.threads,d.id);if(t)t.unread=0;saveDB();render();},
  'msg-send':()=>{
    const input=$('#msgInput');if(!input)return;
    const text=input.value.trim();if(!text)return;
    const t=byId(DB.threads,UI.msg.active);if(!t)return;
    t.messages.push({from:'me',text:text,time:fmtTime(nowTime())});
    saveDB();render();toast('Message sent');
  },
  'msg-new':()=>{closeAllModals();if(!needPatient())return;threadForm();},
  'msg-call':d=>{const t=byId(DB.threads,d.id);toast('Calling '+t.name+'…');},
  'msg-delete':d=>{
    const t=byId(DB.threads,d.id);if(!t)return;
    confirmDialog('Delete conversation','Delete the conversation with '+t.name+'?',()=>{
      DB.threads=DB.threads.filter(x=>x.id!==d.id);UI.msg.active=DB.threads[0]?DB.threads[0].id:null;saveDB();closeAllModals();render();toast('Conversation deleted','bad');});
  },
  'thread-create':()=>{
    const m=currentModal();const v=required(m,['patientId','text']);if(!v)return;
    const p=patient(v.patientId);
    let t=DB.threads.filter(x=>x.name===p.name)[0];
    if(!t){t={id:'MS-'+(DB.threads.length+1)+Date.now().toString().slice(-3),name:p.name,role:'Patient — '+p.id,unread:0,messages:[]};DB.threads.unshift(t);}
    t.messages.push({from:'me',text:v.text,time:fmtTime(nowTime())});
    UI.msg.active=t.id;saveDB();closeModal();navigate('message');toast('Message sent to '+p.name);
  },

  'settings-tab':d=>{UI.settingsTab=d.tab;render();},
  'settings-save-clinic':()=>{
    const v=required($('#setClinic'),['clinicName']);if(!v)return;
    v.taxRate=+v.taxRate||0;Object.assign(DB.settings,v);saveDB();render();toast('Clinic profile saved');
  },
  'settings-day':d=>{
    const days=DB.settings.workDays;const i=days.indexOf(d.day);
    if(i>-1)days.splice(i,1);else days.push(d.day);
    saveDB();render();
  },
  'settings-save-schedule':()=>{
    const v=formVals($('#setSchedule'));
    DB.settings.openTime=v.openTime;DB.settings.closeTime=v.closeTime;DB.settings.slotMinutes=+v.slotMinutes;
    saveDB();render();toast('Working hours saved');
  },
  'settings-toggle':d=>{DB.settings[d.key]=!DB.settings[d.key];saveDB();render();},
  'staff-new':()=>staffForm(),
  'staff-edit':d=>staffForm(d.id),
  'staff-save':d=>{
    const m=currentModal();const v=required(m,['name']);if(!v)return;
    v.active=v.active==='true';
    if(d.id)Object.assign(doctor(d.id),v);
    else{
      const num=String(DB.counters.staff=(DB.counters.staff||6)+1).padStart(2,'0');
      DB.doctors.push(Object.assign({id:(v.role==='Dentist'||v.role==='Administrator'?'DR-':'ST-')+num},v));
    }
    saveDB();closeModal();render();toast('Staff record saved');
  },
  'staff-delete':d=>{
    const s=doctor(d.id);
    confirmDialog('Remove staff member','Remove '+s.name+' from the clinic roster? Existing records keep their name.',()=>{
      DB.doctors=DB.doctors.filter(x=>x.id!==d.id);saveDB();closeAllModals();render();toast('Staff member removed','bad');});
  },
  'data-backup':()=>{
    const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='braganza-clinic-backup.json';
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},200);
    toast('Backup downloaded');
  },
  'data-restore':()=>{const f=$('#restoreFile');if(f)f.click();},
  'data-reset':()=>{
    confirmDialog('Clear all records','Every patient, appointment, treatment, invoice, prescription and inventory record stored in this browser is permanently removed. Download a backup first if you need them.',()=>{
      DB=seed();saveDB();closeAllModals();render();toast('All records cleared');},'Clear records');
  }
};

document.addEventListener('click',function(e){
  const t=e.target.closest('[data-action]');
  if(document.body.classList.contains('nav-open')&&!e.target.closest('.sidebar')&&!e.target.closest('[data-action="toggle-nav"]'))document.body.classList.remove('nav-open');
  if(!t){
    if(UI.menu){UI.menu=null;renderTopbar();}
    if(!e.target.closest('.search'))$('#searchResults')&&($('#searchResults').innerHTML='');
    return;
  }
  const fromSearch=!!t.closest('#searchResults');
  const tag=t.tagName;
  if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'){
    if(!t.closest('.menu')&&UI.menu&&!t.closest('.top-actions')){UI.menu=null;renderTopbar();}
    return;
  }
  const fn=ACTIONS[t.dataset.action];
  if(!fn)return;
  e.preventDefault();
  if(UI.menu&&t.dataset.action!=='menu'&&!t.closest('.menu'))UI.menu=null;
  fn(Object.assign({},t.dataset));
  if(fromSearch){UI.gq='';const box=$('#searchResults');if(box)box.innerHTML='';const gs=$('#globalSearch');if(gs)gs.value='';}
});

document.addEventListener('input',function(e){
  const el=e.target;
  if(el.id==='globalSearch'){globalSearch(el.value);return;}
  if(el.id==='msgInput')return;
  const a=el.dataset.action;
  if(!a)return;
  if(a==='treat-proc-change'){applyProcedure(el);return;}
  const pos=el.selectionStart;
  const map={'patients-q':['patients','q'],'appts-q':['appts','q'],'treat-q':['treat','q'],'billing-q':['billing','q'],'rx-q':['rx','q'],'inv-q':['inv','q']};
  if(map[a]){UI[map[a][0]][map[a][1]]=el.value;UI[map[a][0]].page=1;render();refocus('[data-action="'+a+'"]',pos);}
});

document.addEventListener('change',function(e){
  const el=e.target;
  const a=el.dataset.action;
  if(el.id==='restoreFile'&&el.files&&el.files[0]){
    const r=new FileReader();
    r.onload=function(){
      try{
        const d=JSON.parse(r.result);
        if(!d.patients||!d.settings)throw 0;
        DB=d;saveDB();render();toast('Backup restored');
      }catch(err){toast('That file is not a valid clinic backup','bad');}
    };
    r.readAsText(el.files[0]);return;
  }
  if(!a)return;
  if(a==='rx-patient-change'){applyRxPatient(el);return;}
  const simple={
    'patients-status':()=>{UI.patients.status=el.value;UI.patients.page=1;},
    'patients-sort':()=>{UI.patients.sort=el.value;},
    'appts-status':()=>{UI.appts.status=el.value;UI.appts.page=1;},
    'appts-doctor':()=>{UI.appts.doctor=el.value;UI.appts.page=1;},
    'appts-from':()=>{UI.appts.from=el.value;UI.appts.page=1;},
    'appts-to':()=>{UI.appts.to=el.value;UI.appts.page=1;},
    'treat-status':()=>{UI.treat.status=el.value;UI.treat.page=1;},
    'billing-status':()=>{UI.billing.status=el.value;UI.billing.page=1;},
    'inv-category':()=>{UI.inv.category=el.value;UI.inv.page=1;},
    'reports-range':()=>{UI.reports.range=el.value;},
    'cal-month':()=>{UI.calMonth=+el.value;},
    'cal-year':()=>{UI.calYear=+el.value;},
    'page-cal-month':()=>{UI.pageCal.m=+el.value;},
    'page-cal-year':()=>{UI.pageCal.y=+el.value;},
    'settings-user':()=>{DB.settings.currentUser=el.value;saveDB();}
  };
  if(simple[a]){simple[a]();render();return;}
});

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(modalStack.length)closeModal();
    else if(UI.menu){UI.menu=null;renderTopbar();}
    else if(document.body.classList.contains('nav-open'))document.body.classList.remove('nav-open');
  }
  if(e.key==='Enter'&&e.target.id==='msgInput'){e.preventDefault();ACTIONS['msg-send']({});}
  if(e.key==='Enter'&&(e.target.id==='loginPass'||e.target.id==='loginUser')){e.preventDefault();signIn();}
});

function globalSearch(q){
  const box=$('#searchResults');if(!box)return;
  UI.gq=q;
  const term=q.trim().toLowerCase();
  if(term.length<2){box.innerHTML='';return;}
  const out=[];
  DB.patients.filter(p=>(p.name+' '+p.id+' '+p.phone).toLowerCase().includes(term)).slice(0,5)
    .forEach(p=>out.push({icon:'patient',title:p.name,sub:'Patient • '+p.id,action:'patient-view',id:p.id}));
  DB.appointments.filter(a=>(pName(a.patientId)+' '+a.id+' '+a.type).toLowerCase().includes(term)).slice(0,4)
    .forEach(a=>out.push({icon:'appointments',title:pName(a.patientId)+' — '+a.type,sub:'Appointment • '+fmtDate(a.date)+' '+fmtTime(a.time),action:'appt-view',id:a.id}));
  DB.invoices.filter(v=>(v.id+' '+pName(v.patientId)).toLowerCase().includes(term)).slice(0,3)
    .forEach(v=>out.push({icon:'billing',title:v.id+' — '+pName(v.patientId),sub:'Invoice • '+money(invTotal(v)),action:'inv-view',id:v.id}));
  DB.inventory.filter(i=>(i.name+' '+i.id).toLowerCase().includes(term)).slice(0,3)
    .forEach(i=>out.push({icon:'box',title:i.name,sub:'Inventory • '+i.qty+' '+i.unit,action:'item-edit',id:i.id}));
  box.innerHTML=out.length?out.map(r=>'<button data-action="'+r.action+'" data-id="'+r.id+'"><span style="color:var(--brand)">'+icon(r.icon,17)+'</span><span style="flex:1"><b style="display:block;font-size:13px">'+esc(r.title)+'</b><span style="font-size:11.5px;color:var(--muted)">'+esc(r.sub)+'</span></span></button>').join('')
    :'<div class="empty" style="padding:18px"><b>No matches</b><span>Try a different name, ID or invoice number.</span></div>';
}

restoreSession();
</script>
